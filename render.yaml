services:
  - type: web
    name: zerodha-clone
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "on"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_DB_NAME
        value: zerodha_clone
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
